name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
      - name: Python install
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package install
        run: pip install -r requirements.txt
      - name: DB initialize
        run: python -m app.init_db
      - name: Server import test
        run: python -c "from app.main import app; print('App imported')"